# Railway deployment config (root-level)
# Tek servis hem server hem client'i serve eder (Faz 8'de static build eklenince)
# Build: custom Dockerfile (Tailscale VPN destegi icin)
# Start: docker-entrypoint.sh → tailscale up → npm start

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/ping"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
